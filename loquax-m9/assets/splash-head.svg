<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="112" height="112">
  <!-- Nessa's head for the M9's power-on splash (1690). Hand-drawn for the
       panel's black: white fur, the eyes and the nose cut out, the muzzle
       one outline. Not a threshold of the colour head — thresholded, her
       cream muzzle and dark nose become a bear's snout, and a round skull
       with two big round ears on top finishes the job. So the skull is wide
       and flat on top with the cheek flares her drawing has, the ears are
       small and set wide at its corners, the eyes narrow under a brow, and
       the muzzle is one long line around a small nose.

       scripts/nessa-render.py renders this to splash-head.png (112 px, what
       a person looks at) and packs it to splash-head.1bpp (what the board
       burns: one bit a pixel, set = ink). Edit this file, then run the
       script; `just nessa-check` refuses a tree where the two disagree. -->
  <rect x="0" y="0" width="112" height="112" fill="#000000"/>
  <g fill="#ffffff">
    <!-- The ears stand as triangles at the skull's corners. Round ears on a
         round head are a bear, and three draws of this picture settled into
         exactly that before the corners were given a point. -->
    <path d="M22,44 L17,16 Q16.5,12.5 20,14 L44,30Z"/>
    <path d="M90,44 L95,16 Q95.5,12.5 92,14 L68,30Z"/>
    <!-- The skull: flat on top, the cheeks flaring below the eyes. -->
    <path d="M56,28 C41,28 26,33 20,46 C15,57 15,74 24,84 C34,95 45,99 56,99 C67,99 78,95 88,84 C97,74 97,57 92,46 C86,33 71,28 56,28Z"/>
  </g>
  <g fill="#000000">
    <!-- Inner ears, the eyes under their brows, the nose, two whisker dots
         a side. -->
    <path d="M25,40 L21,21 L38,32Z"/>
    <path d="M87,40 L91,21 L74,32Z"/>
    <path d="M30,52 Q39,47 48,53 Q39,56 30,52Z"/>
    <path d="M64,53 Q73,47 82,52 Q73,56 64,53Z"/>
    <path d="M51,64 Q56,62 61,64 L56,69Z"/>
    <path d="M39,79 a1.4,1.4 0 1,0 2.8,0 a1.4,1.4 0 1,0 -2.8,0Z M45,82 a1.4,1.4 0 1,0 2.8,0 a1.4,1.4 0 1,0 -2.8,0Z"/>
    <path d="M64,82 a1.4,1.4 0 1,0 2.8,0 a1.4,1.4 0 1,0 -2.8,0Z M70,79 a1.4,1.4 0 1,0 2.8,0 a1.4,1.4 0 1,0 -2.8,0Z"/>
  </g>
  <g fill="none" stroke="#000000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- A brow over each eye: she is not surprised. -->
    <path d="M29,45 Q39,41 49,46"/>
    <path d="M63,46 Q73,41 83,45"/>
    <!-- The muzzle, as an outline around the nose. -->
    <path d="M56,69 L56,79"/>
    <path d="M47,77 Q51,84 56,79 Q61,84 65,77"/>
  </g>
</svg>
