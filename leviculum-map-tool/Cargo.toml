[package]
name = "leviculum-map-tool"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Cuts map region files from Protomaps PMTiles archives and height packs from Copernicus GLO-30, for leviculum-map (#474)"
# A desktop tool run by hand; no package ships it and nothing links it.
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
leviculum-map = { path = "../leviculum-map", features = ["std"] }
leviculum-mapfill = { path = "../leviculum-mapfill", features = ["std"] }
# The cut itself, shared with loquax's autoload (1089); `http` for an
# `https://` input read by range requests.
leviculum-mapcut = { path = "../leviculum-mapcut", features = ["http"] }
embedded-graphics = "0.8"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
# The one allocator of every program (1805, docs/src/architecture.md
# "Memory allocator"). The cut allocates per feature and per ring on every
# worker; on musl's allocator a Hessen cut spent twice as long in the kernel
# as in user space.
leviculum-alloc = { path = "../leviculum-alloc" }
# The height cut (1740): GLO-30 cells fetched over HTTP into memory
# (rustls on ring, as leviculum-mapcut's http), their DEFLATE tiles
# inflated, and the height tiles compressed as zstd frames at level 19,
# the encoding the Morocco pilot measured. The reader in leviculum-map is
# pure Rust (ruzstd); the C library is only on this desktop side.
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = "1"
libm = "0.2"
zstd = { version = "0.13", default-features = false }
# The ground cut (1743): Kellndorfer's radar tiles are LZW GeoTIFFs. The
# crate is in the lock already (through the image decoders).
weezl = "0.1"

[dev-dependencies]
# The height cut's tests write synthetic GLO-30 cells into a directory.
tempfile = "3"
# The ground cut's test writes a synthetic height pack (1743); in the lock
# already, through leviculum-map's height pieces.
ruzstd = { version = "0.9", default-features = false, features = ["hash"] }
